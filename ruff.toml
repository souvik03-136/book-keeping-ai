# book-keeping-ai/ruff.toml

[lint]
select  = ["E", "F", "W", "I"]
ignore  = [
    # E402: imports not at top — intentional in forecasting.py (env vars and
    # warnings.filterwarnings must run before TensorFlow/statsmodels import).
    "E402",
]

[lint.per-file-ignores]
# Test fixtures use importlib.util / inline imports that look unused to ruff.
"tests/*" = ["F401", "I001"]

[lint.isort]
# Flat service-internal modules are first-party (not installed packages).
known-first-party = ["tasks", "utils", "forecasting", "bokeh_forecast"]

[lint.pycodestyle]
max-line-length = 100