
events {
    worker_connections 1024;
}

http {
    upstream forecast_api {
        server forecast-api:5000;
        keepalive 32;
    }

    upstream entity_api {
        server entity-api:5001;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # For development/testing without TLS:
        location /api/v1/forecast {
            proxy_pass http://forecast_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            limit_req zone=api burst=10 nodelay;
        }

        location /api/v1/ {
            proxy_pass http://forecast_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/extract {
            proxy_pass http://entity_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            limit_req zone=api burst=20 nodelay;
        }

        location /health {
            proxy_pass http://forecast_api/health;
            access_log off;
        }
    }

    # Uncomment and configure for HTTPS:
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     ... (same location blocks as above)
    # }
}